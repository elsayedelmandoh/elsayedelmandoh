<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="streak: current 2 days, longest 9 days, 730 contributions in the last year">
<title>streak: current 2 days, longest 9 days, 730 contributions in the last year</title>
<style>
svg{--bg:#f6f8fa;--bd:#d0d7de;--tx:#1f2328;--mu:#656d76;--ac:#0969da;--ac2:#0891b2;--ok:#1a7f37;--bad:#cf222e;--g1:#ffffff;--g2:#dbeafe}
@media (prefers-color-scheme: dark){svg{--bg:#161b22;--bd:#30363d;--tx:#e6edf3;--mu:#8b949e;--ac:#38bdf8;--ac2:#22d3ee;--ok:#3fb950;--bad:#f85149;--g1:#0d1117;--g2:#0c2a43}}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.b{font-weight:700}
.tx{fill:var(--tx)}.mu{fill:var(--mu)}.ac{fill:var(--ac)}.ok{fill:var(--ok)}.bad{fill:var(--bad)}
.card{fill:var(--bg);stroke:var(--bd)}
.chip{fill:none;stroke:var(--ac)}
.bar{fill:var(--ac)}
.ln{stroke:var(--bd);fill:none}
</style>
<rect x=".5" y=".5" width="1199" height="149" rx="12" class="card"/>
<rect x="28" y="20" width="370" height="110" rx="10" class="card"/>
<text x="44" y="48" font-size="13" class="mu">current streak</text>
<text x="44" y="94" font-size="38" class="ac m b">2</text>
<text x="44" y="118" font-size="12" class="mu">days</text>
<rect x="414" y="20" width="370" height="110" rx="10" class="card"/>
<text x="430" y="48" font-size="13" class="mu">longest streak</text>
<text x="430" y="94" font-size="38" class="ac m b">9</text>
<text x="430" y="118" font-size="12" class="mu">days</text>
<rect x="800" y="20" width="370" height="110" rx="10" class="card"/>
<text x="816" y="48" font-size="13" class="mu">total contributions</text>
<text x="816" y="94" font-size="38" class="ac m b">730</text>
<text x="816" y="118" font-size="12" class="mu">last year</text>
