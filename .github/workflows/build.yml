name: update profile card

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate cards
        if: env.HAS_TOKEN == 'true'
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: pip install -r requirements.txt && python today.py
      # NOTE: this snake step could not be tested offline; verify on the first workflow run.
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: elsayedelmandoh
          outputs: |
            assets/generated/snake.svg
            assets/generated/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        if: env.HAS_TOKEN == 'true'
        run: |
          git add dark_mode.svg light_mode.svg assets/generated
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update profile card"
          git push
