name: update profile card

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate cards
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: pip install -r requirements.txt && python today.py
      - name: Commit changes
        run: |
          git add dark_mode.svg light_mode.svg contrib_dark.svg contrib_light.svg
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update profile card"
          git push
